<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"></head><body style="margin:0">
<title>Thuisscherm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: wandscherm voor een liggende tablet. Huis + energiestroom als hoofdkaart links,
   rechts twee kolommen met kachel/printer en weer/agenda. Valt terug naar 2 en 1 kolom. */
:root{
  --bg:#0e141b; --surface:#151e28; --surface-2:#1d2834; --line:#26323f;
  --fg:#e9eef3; --muted:#8a99a8; --faint:#5b6a79;
  --sun:#f4b740; --batt:#3fcf9a; --grid:#7c9cff; --heat:#ff7a45; --cool:#5cc8ff; --print:#c49bff;
  --ok:#3fcf9a; --warn:#f4b740; --bad:#ff6b6b;
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e9eef2; --surface:#f8fafb; --surface-2:#eef2f5; --line:#d9e0e6;
    --fg:#15202a; --muted:#5d6b78; --faint:#94a1ad;
    --sun:#d48a00; --batt:#119a6a; --grid:#4362e0; --heat:#e3561f; --cool:#0f8fca; --print:#8a55e6;
    --ok:#119a6a; --warn:#c07c00; --bad:#d63c3c;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e9eef2; --surface:#f8fafb; --surface-2:#eef2f5; --line:#d9e0e6;
  --fg:#15202a; --muted:#5d6b78; --faint:#94a1ad;
  --sun:#d48a00; --batt:#119a6a; --grid:#4362e0; --heat:#e3561f; --cool:#0f8fca; --print:#8a55e6;
  --ok:#119a6a; --warn:#c07c00; --bad:#d63c3c;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none}
.wrap{min-height:100%;box-sizing:border-box;padding-block:20px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);
  grid-template-areas:"top top top" "house climate weather" "house printer agenda";gap:16px;height:100%}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;
  min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.card h2{margin:0;font:600 12px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:8px}
.card h2 .src{margin-left:auto;font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex:none}

/* top */
.top{grid-area:top;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.clock{font:300 clamp(48px,6.4vw,84px)/.9 var(--f-display);letter-spacing:-.03em}
.date{display:flex;flex-direction:column;gap:4px;padding-bottom:6px}
.date b{font:600 18px/1.2 var(--f-display)}
.date span{color:var(--muted)}
.top-right{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.pill b{color:var(--fg);font-weight:600}
.pill.demo{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}

/* house */
.house{grid-area:house}
.house svg.flow{width:100%;flex:1 1 0;min-height:150px;height:100%}
.flow .lbl{font:600 17px var(--f-display);fill:var(--fg)}
.flow .sub{font:500 11.5px var(--f-body);fill:var(--muted);letter-spacing:.04em}
.flow .wall{fill:var(--surface-2);stroke:var(--line);stroke-width:2}
.flow .roof{fill:var(--surface-2);stroke:var(--line);stroke-width:2}
.flow .panel{fill:color-mix(in srgb,var(--grid) 28%,var(--surface));stroke:var(--line);stroke-width:1}
.flow .ground{stroke:var(--line);stroke-width:2}
.flow .win{fill:color-mix(in srgb,var(--sun) 30%,var(--surface-2))}
.flow .pipe{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round}
.flow .stream{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 12;animation:flow 1.1s linear infinite}
.flow .stream.rev{animation-direction:reverse}
.flow .stream.off{opacity:0}
@keyframes flow{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){.flow .stream{animation:none;stroke-dasharray:none;opacity:.7}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat span{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.stat b{font:600 19px/1.1 var(--f-display)}
.stat b small{font:500 12px var(--f-body);color:var(--muted);margin-left:2px}
.curve{width:100%;height:84px;display:block}
.curve text{font:500 10.5px var(--f-body);fill:var(--faint)}
.soon{display:flex;gap:8px}
.soon div{flex:1;border:1px dashed var(--line);border-radius:14px;padding:9px 12px;color:var(--faint);font-size:12.5px;display:flex;align-items:center;gap:8px}
.soon svg{width:18px;height:18px;flex:none}

/* climate */
.climate{grid-area:climate}
.climate .body{display:flex;align-items:center;gap:14px;flex:1;min-height:0}
.dial{flex:1;min-width:0;max-height:100%;aspect-ratio:1;max-width:220px;position:relative}
.dial svg{width:100%;height:100%}
.dial .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dial .set{font:300 clamp(34px,3.6vw,48px)/1 var(--f-display);letter-spacing:-.02em}
.dial .set sup{font-size:.4em;vertical-align:top;margin-left:2px}
.dial .now{font-size:12.5px;color:var(--muted)}
.dial .act{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.ctrls{display:flex;flex-direction:column;gap:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:16px;
  width:64px;height:64px;font:300 30px/1 var(--f-display);cursor:pointer;display:grid;place-items:center;transition:transform .1s,background .2s}
.btn:active{transform:scale(.94)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--grid);outline-offset:2px}
.btn.up{color:var(--heat)} .btn.down{color:var(--cool)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 13px;font:500 13px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* printer */
.printer{grid-area:printer}
.printer .body{display:flex;gap:16px;align-items:center;flex:1;min-height:0}
.ring{width:108px;height:108px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:38px;box-sizing:border-box;font:600 26px var(--f-display)}
.ring .center small{font-size:12px;color:var(--muted)}
.pinfo{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.pinfo .file{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv span{color:var(--muted)} .kv b{font-weight:600;text-align:right}
.state{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;
  background:color-mix(in srgb,currentColor 14%,transparent)}

/* weather */
.weather{grid-area:weather}
.wnow{display:flex;align-items:center;gap:14px}
.weather .chips{margin-top:-4px}
.weather .chip{padding:5px 12px}
.wnow .ico{width:64px;height:64px;flex:none}
.wnow .t{font:300 clamp(40px,4vw,54px)/1 var(--f-display);letter-spacing:-.02em}
.wnow .d{display:flex;flex-direction:column;gap:3px;min-width:0}
.wnow .d b{font-weight:600}
.wnow .d span{color:var(--muted);font-size:13px}
.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;font-size:12px}
.hours div{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted)}
.hours b{color:var(--fg);font-weight:600;font-size:13.5px}
.hours svg{width:24px;height:24px}
.hours .rain{color:var(--cool);font-size:11px;min-height:13px}
.days{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.day{display:grid;grid-template-columns:34px 22px 34px 1fr 34px;align-items:center;gap:8px;font-size:13px}
.day .n{color:var(--muted);text-transform:capitalize}
.day svg{width:20px;height:20px}
.day .lo{color:var(--muted);text-align:right}
.bar{height:6px;border-radius:3px;background:var(--surface-2);position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--cool),var(--sun))}

/* agenda */
.agenda{grid-area:agenda}
.alist{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
.aday{font:600 12px var(--f-body);color:var(--muted);letter-spacing:.04em;margin-top:6px}
.aday:first-child{margin-top:0}
.ev{display:grid;grid-template-columns:52px 4px 1fr;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface-2)}
.ev .tm{font-size:13px;font-weight:600}
.ev .tm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.ev i{align-self:stretch;border-radius:2px}
.ev .tt{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev .tt small{display:block;color:var(--muted);font-size:12px}
.ev.past{opacity:.45}
.empty{color:var(--faint);font-size:13px}


/* ultrawide: alles naast elkaar in vier kolommen */
.wrap[data-layout="ultra"]{grid-template-columns:1.35fr 1fr 1fr 1fr;grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);height:100%;
  grid-template-areas:"top top top top" "house climate weather agenda" "house printer weather agenda"}
.wrap[data-layout="ultra"] .days{margin-top:16px}
.wrap[data-layout="ultra"] .weather .hours{margin-top:8px}
body.part{display:flex;height:100%}
body.part .wrap{flex:none}
@media (max-width:1100px){
  .wrap{grid-template-columns:1fr 1fr;grid-template-rows:auto;height:auto;
    grid-template-areas:"top top" "house house" "climate weather" "printer agenda"}
  .house svg.flow{max-height:360px}
}
@media (max-width:680px){
  .wrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "house" "climate" "weather" "printer" "agenda";
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stats{grid-template-columns:repeat(2,1fr)}
  .top-right{margin-left:0}
}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="clock num" id="clock">--:--</div>
    <div class="date"><b id="date">&nbsp;</b><span id="greet">&nbsp;</span></div>
    <div class="top-right" id="pills"></div>
  </header>

  <section class="card house" aria-label="Huis en energie">
    <h2><span class="dot" style="color:var(--sun)"></span>Huis &amp; energie<span class="src" id="src-energy"></span></h2>
    <svg class="flow" viewBox="0 0 560 290" role="img" aria-label="Energiestroom tussen zon, accu, net en huis">
      <!-- leidingen -->
      <path class="pipe" id="p-sun" d="M110 92 C170 92 200 104 236 124"/>
      <path class="pipe" id="p-grid" d="M92 224 L206 224"/>
      <path class="pipe" id="p-batt" d="M354 224 L452 224"/>
      <path class="stream" id="s-sun" d="M110 92 C170 92 200 104 236 124" style="stroke:var(--sun)"/>
      <path class="stream" id="s-grid" d="M92 224 L206 224" style="stroke:var(--grid)"/>
      <path class="stream" id="s-batt" d="M354 224 L452 224" style="stroke:var(--batt)"/>
      <!-- zon -->
      <g id="sun-ico" transform="translate(70 92)">
        <circle r="20" style="fill:var(--sun)"/>
        <g style="stroke:var(--sun)" stroke-width="3" stroke-linecap="round">
          <path d="M0 -30v-7M0 30v7M-30 0h-7M30 0h7M-21 -21l-5 -5M21 21l5 5M-21 21l-5 5M21 -21l5 -5"/>
        </g>
      </g>
      <text class="lbl num" x="70" y="160" text-anchor="middle" id="t-sun">–</text>
      <text class="sub" x="70" y="176" text-anchor="middle">ZONNEPANELEN</text>
      <!-- huis -->
      <line class="ground" x1="20" y1="270" x2="540" y2="270"/>
      <polygon class="roof" points="186,138 280,62 374,138"/>
      <g id="panels">
        <polygon class="panel" points="236,108 258,90 278,90 256,108"/>
        <polygon class="panel" points="262,108 284,90 304,90 282,108"/>
        <polygon class="panel" points="222,124 244,106 264,106 242,124"/>
        <polygon class="panel" points="248,124 270,106 290,106 268,124"/>
      </g>
      <rect class="wall" x="202" y="136" width="156" height="134"/>
      <rect class="win" x="222" y="156" width="34" height="30" rx="3"/>
      <rect class="win" x="304" y="156" width="34" height="30" rx="3"/>
      <rect class="wall" x="264" y="214" width="32" height="56" rx="3"/>
      <text class="lbl num" x="280" y="206" text-anchor="middle" id="t-home">–</text>
      <text class="sub" x="280" y="150" text-anchor="middle" dy="-0">&nbsp;</text>
      <!-- net -->
      <g transform="translate(60 224)" style="stroke:var(--grid)" fill="none" stroke-width="3" stroke-linejoin="round">
        <path d="M-14 46 L0 -30 L14 46 M-9 18h18 M-6 2h12 M-20 -18h40 M-16 -6h32"/>
      </g>
      <text class="lbl num" x="60" y="148" text-anchor="middle" id="t-grid" dy="0" style="display:none">–</text>
      <!-- accu -->
      <g transform="translate(470 186)">
        <rect x="0" y="0" width="56" height="84" rx="9" style="fill:var(--surface-2);stroke:var(--batt)" stroke-width="3"/>
        <rect x="18" y="-8" width="20" height="8" rx="2" style="fill:var(--batt)"/>
        <rect id="batt-fill" x="6" y="6" width="44" height="72" rx="5" style="fill:var(--batt);opacity:.85"/>
      </g>
      <text class="lbl num" x="498" y="150" text-anchor="middle" id="t-batt">–</text>
      <text class="sub num" x="498" y="168" text-anchor="middle" id="t-batt-sub">THUISACCU</text>
      <text class="lbl num" x="150" y="210" text-anchor="middle" id="t-grid2">–</text>
      <text class="sub" x="150" y="248" text-anchor="middle" id="t-grid-sub">NET</text>
      <text class="sub" x="280" y="236" text-anchor="middle" style="opacity:0">.</text>
    </svg>
    <div class="stats" id="stats"></div>
    <svg class="curve" id="curve" viewBox="0 0 600 84" preserveAspectRatio="none" aria-label="Zonne-opbrengst vandaag"></svg>
    <div class="soon">
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>Verlichting · binnenkort</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>Camera's · binnenkort</div>
    </div>
  </section>

  <section class="card climate" aria-label="Kachel">
    <h2><span class="dot" style="color:var(--heat)"></span>Kachel<span class="src" id="src-climate"></span></h2>
    <div class="body">
      <div class="dial">
        <svg viewBox="0 0 200 200" id="dial"></svg>
        <div class="center">
          <div class="act" id="c-act">&nbsp;</div>
          <div class="set num" id="c-set">–</div>
          <div class="now num" id="c-now">&nbsp;</div>
        </div>
      </div>
      <div class="ctrls">
        <button class="btn up" id="c-up" aria-label="Warmer">+</button>
        <button class="btn down" id="c-down" aria-label="Kouder">−</button>
      </div>
    </div>
    <div class="chips" id="c-modes"></div>
  </section>

  <section class="card printer" aria-label="3D-printer">
    <h2><span class="dot" style="color:var(--print)"></span>3D-printer<span class="src" id="src-printer"></span></h2>
    <div class="body">
      <div class="ring">
        <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" style="stroke:var(--surface-2)" stroke-width="10"/>
          <circle id="p-ring" cx="60" cy="60" r="50" fill="none" style="stroke:var(--print)" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 400"/></svg>
        <div class="center num" id="p-pct">–</div>
      </div>
      <div class="pinfo">
        <div><span class="state" id="p-state">–</span></div>
        <div class="file" id="p-file">&nbsp;</div>
        <div class="kv num" id="p-kv"></div>
      </div>
    </div>
  </section>

  <section class="card weather" aria-label="Weer">
    <h2><span class="dot" style="color:var(--cool)"></span>Weer<span class="src" id="src-weather"></span></h2>
    <div class="chips" id="w-places"></div>
    <div class="wnow">
      <div class="ico" id="w-ico"></div>
      <div class="t num" id="w-t">–</div>
      <div class="d"><b id="w-desc">&nbsp;</b><span id="w-extra">&nbsp;</span></div>
    </div>
    <div class="hours num" id="w-hours"></div>
    <div class="days num" id="w-days"></div>
  </section>

  <section class="card agenda" aria-label="Agenda">
    <h2><span class="dot" style="color:var(--grid)"></span>Agenda<span class="src" id="src-agenda"></span></h2>
    <div class="alist" id="a-list"></div>
  </section>
</div>

<script>
/* =====================================================================
   INSTELLINGEN — dit is het enige deel dat je hoeft aan te passen.
   Laat ha.token leeg om met voorbeelddata te draaien.
   ===================================================================== */
const CONFIG = {
  places: [
    { name: "Thuis", town: "Melissant", lat: 51.77, lon: 4.08 },
    { name: "Werk",  town: "Rotterdam", lat: 51.88, lon: 4.41 },
  ],
  ha: {
    url: "",            // leeg = zelfde adres als dit scherm (aanrader: zet het bestand in Home Assistant /config/www)
    token: "",          // Long-Lived Access Token uit je HA-profiel
    pollSeconds: 5,
  },
  entities: {
    solarPower:   "sensor.solar_power",          // W, actueel vermogen zonnepanelen
    solarToday:   "sensor.solar_energy_today",   // kWh vandaag
    batterySoc:   "sensor.battery_soc",          // %
    batteryPower: "sensor.battery_power",        // W, positief = laden, negatief = ontladen
    gridPower:    "sensor.grid_power",           // W, positief = afname van net, negatief = teruglevering
    homeToday:    "sensor.home_energy_today",    // kWh vandaag (optioneel)
    exportToday:  "sensor.grid_export_today",    // kWh vandaag (optioneel)
    // SHPI-thermostaat via de REST-koppeling uit homeassistant/shpi.yaml
    climate: { type: "shpi", current: "sensor.shpi_temperatuur", target: "sensor.shpi_ingestelde_temperatuur",
               relay: "binary_sensor.shpi_verwarming", setService: "rest_command/shpi_set_temp" },
    printer: {
      name:     "Creality K2 Pro",
      state:    "sensor.k1_print_status",
      progress: "sensor.k1_print_progress",      // %
      file:     "sensor.k1_print_filename",
      left:     "sensor.k1_print_time_left",     // seconden of minuten (zie timeLeftUnit)
      nozzle:   "sensor.k1_nozzle_temperature",
      nozzleT:  "sensor.k1_nozzle_target",
      bed:      "sensor.k1_bed_temperature",
      bedT:     "sensor.k1_bed_target",
      layer:    "sensor.k1_current_layer",
      layers:   "sensor.k1_total_layers",
      timeLeftUnit: "s",
    },
    calendars: [ { id: "calendar.persoonlijk", color: "var(--grid)" }, { id: "calendar.werk", color: "var(--print)" } ],
  },
  climatePresets: ["comfort", "eco", "away"],
  climateRange: [12, 26],
};

/* ===================================================================== */
const $ = id => document.getElementById(id);
const nl = "nl-NL";
const fmt = (v, d = 0) => (v == null || isNaN(v)) ? "–" : Number(v).toLocaleString(nl, { minimumFractionDigits: d, maximumFractionDigits: d });

function solarAt(t) { // kW, novemberdag ~7:55–16:50 met wat wolken
  const h = t.getHours() + t.getMinutes() / 60, rise = 7.9, set = 16.85;
  if (h <= rise || h >= set) return 0;
  const x = (h - rise) / (set - rise);
  const clouds = 0.72 + 0.28 * Math.sin(h * 5.3) * Math.cos(h * 2.1);
  return Math.max(0, 2.6 * Math.pow(Math.sin(Math.PI * x), 1.6) * clouds);
}
function demoEnergy() {
  const now = new Date(), curve = [];
  const start = new Date(now); start.setHours(6, 0, 0, 0);
  let kwh = 0;
  for (let t = new Date(start); t <= now && t.getHours() < 21; t = new Date(t.getTime() + 15 * 60000)) {
    const v = solarAt(t); curve.push([t.getTime(), v]); kwh += v / 4;
  }
  const solar = solarAt(now) * 1000;
  const home = 420 + 160 * Math.sin(now.getMinutes() / 9) + (now.getHours() >= 17 && now.getHours() < 22 ? 380 : 0);
  let soc = 78, batt = 0, grid = 0;
  const surplus = solar - home;
  if (surplus > 0) { batt = Math.min(surplus, 2400); grid = -(surplus - batt); soc = 64; }
  else { batt = -Math.min(-surplus, 2200); grid = 0; soc = now.getHours() >= 17 ? 71 : 52; }
  return { solar, home, soc, batt, grid, solarToday: kwh, homeToday: 9.4, exportToday: Math.max(0, kwh - 7.1), curve };
}

async function ha(path, opts = {}) {

let STATES = {};
const st = id => STATES[id];
const nv = id => { const s = st(id); const v = s ? parseFloat(s.state) : NaN; return isNaN(v) ? null : v; };
async function pollHA() {
  try {
    const arr = await ha("/api/states");
    STATES = Object.fromEntries(arr.map(s => [s.entity_id, s]));
    const E = CONFIG.entities;
    if (st(E.solarPower) || st(E.batterySoc)) {
      const solar = nv(E.solarPower) ?? 0, batt = nv(E.batteryPower) ?? 0, grid = nv(E.gridPower) ?? 0;
      S.energy = { ...(S.energy || {}), solar, batt, grid, soc: nv(E.batterySoc), home: Math.max(0, solar + grid - batt),
        solarToday: nv(E.solarToday), homeToday: nv(E.homeToday), exportToday: nv(E.exportToday) };
      S.src.energy = "live";
    }
    const sh = typeof E.climate === "object" ? E.climate : null;
    if (sh && st(sh.current) && !climateBusy) {
      const r = st(sh.relay);
      S.climate = { current: nv(sh.current), target: nv(sh.target), action: r ? (r.state === "on" ? "heating" : "idle") : "idle",
        presets: [], min: 12, max: 26, step: .5 };
      S.src.climate = "live";
    }
    const c = sh ? null : st(E.climate);
    if (c && !climateBusy) {
      const a = c.attributes;
      S.climate = { current: a.current_temperature, target: a.temperature, action: a.hvac_action || c.state, preset: a.preset_mode,
        presets: a.preset_modes || [], min: a.min_temp ?? 7, max: a.max_temp ?? 30, step: a.target_temp_step || .5 };
      S.src.climate = "live";
    }
    const P = E.printer;
    if (st(P.state)) {
      let left = nv(P.left); if (left != null && P.timeLeftUnit === "min") left *= 60;
      S.printer = { name: P.name, state: (st(P.state).state || "").toLowerCase(), progress: nv(P.progress), file: st(P.file)?.state,
        left, nozzle: nv(P.nozzle), nozzleT: nv(P.nozzleT), bed: nv(P.bed), bedT: nv(P.bedT), layer: nv(P.layer), layers: nv(P.layers) };
      S.src.printer = "live";
    }
    S.src.ha = "ok";
  } catch (e) { S.src.ha = "fout"; console.warn(e); }
  render();
}

let climateBusy = false, climateTimer;
function setTarget(delta) {
  const c = S.climate; if (!c) return;
  const step = c.step || .5;
  c.target = Math.min(c.max, Math.max(c.min, Math.round((c.target + delta) / step) * step));
  if (!LIVE) c.action = c.target > c.current ? "heating" : "idle";
  render();
  if (!LIVE) return;
  climateBusy = true; clearTimeout(climateTimer);
  climateTimer = setTimeout(async () => {
    const E = CONFIG.entities.climate;
    try {
      if (typeof E === "object") await ha("/api/services/" + E.setService, { method: "POST", body: JSON.stringify({ temperatuur: c.target }) });
      else await ha("/api/services/climate/set_temperature", { method: "POST", body: JSON.stringify({ entity_id: E, temperature: c.target }) });
    }
    catch (e) { console.warn(e); }
    setTimeout(() => climateBusy = false, 2500);

}

function polar(cx, cy, r, a) { const rad = (a - 90) * Math.PI / 180; return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)]; }
function arc(cx, cy, r, a0, a1) { const [x0, y0] = polar(cx, cy, r, a0), [x1, y1] = polar(cx, cy, r, a1); return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`; }
const srcLabel = k => S.src[k] === "live" ? "live" : "voorbeeld";

  const lvl = Math.max(0, Math.min(100, e.soc ?? 0)) / 100, f = $("batt-fill");
  f.setAttribute("height", 72 * lvl); f.setAttribute("y", 6 + 72 * (1 - lvl));
  const w = v => Math.max(3, Math.min(9, 3 + Math.abs(v) / 400));

  const sG = $("s-grid"); sG.classList.toggle("off", Math.abs(e.grid) < 20); sG.classList.toggle("rev", e.grid < 0); sG.style.strokeWidth = w(e.grid);
  const sB = $("s-batt"); sB.classList.toggle("off", Math.abs(e.batt) < 20); sB.classList.toggle("rev", e.batt < 0); sB.style.strokeWidth = w(e.batt);
  $("sun-ico").style.opacity = e.solar < 20 ? .35 : 1;

  const tiles = [["Opgewekt vandaag", fmt(e.solarToday, 1), "kWh"], ["Verbruik vandaag", fmt(e.homeToday, 1), "kWh"],
    ["Teruggeleverd", fmt(e.exportToday, 1), "kWh"], ["Accu", fmt(e.soc), "%"]];
  $("stats").innerHTML = tiles.map(([l, v, u]) => `<div class="stat"><span>${l}</span><b class="num">${v}<small>${u}</small></b></div>`).join("");

  // opbrengstcurve 06:00–20:00
  const c = e.curve || [], svg = $("curve"), W = 600, H = 84, top = 6, bot = 66;
  const d0 = new Date(); d0.setHours(6, 0, 0, 0); const t0 = d0.getTime(), t1 = t0 + 14 * 3600e3;
  const ymax = Math.max(1, Math.ceil(Math.max(0, ...c.map(p => p[1]))));
  const X = t => (t - t0) / (t1 - t0) * W, Y = v => bot - v / ymax * (bot - top);
  let g = "";
  for (let k = 0; k <= ymax; k++) g += `<line x1="0" x2="${W}" y1="${Y(k)}" y2="${Y(k)}" style="stroke:var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  [6, 9, 12, 15, 18].forEach(hh => { const x = X(t0 + (hh - 6) * 3600e3); g += `<text x="${x + 2}" y="${H - 4}">${hh}:00</text>`; });
  g += `<text x="${W - 2}" y="${Y(ymax) + 11}" text-anchor="end">${ymax} kW</text>`;
  if (c.length > 1) {
    const pts = c.filter(p => p[0] >= t0 && p[0] <= t1).map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`);
    if (pts.length > 1) {
      const lastX = pts[pts.length - 1].split(",")[0], firstX = pts[0].split(",")[0];
      g += `<polygon points="${firstX},${bot} ${pts.join(" ")} ${lastX},${bot}" style="fill:var(--sun);opacity:.18"/>`;

    }
  }
  const nx = X(Date.now());
  if (nx > 0 && nx < W) g += `<line x1="${nx}" x2="${nx}" y1="${top}" y2="${bot}" style="stroke:var(--muted)" stroke-dasharray="3 3" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  svg.innerHTML = g;
}

  let g = `<path d="${arc(100, 100, 84, A0, A1)}" fill="none" style="stroke:var(--surface-2)" stroke-width="14" stroke-linecap="round"/>`;
  if (c.target != null) g += `<path d="${arc(100, 100, 84, A0, ang(c.target))}" fill="none" style="stroke:${heating ? "var(--heat)" : "var(--muted)"}" stroke-width="14" stroke-linecap="round"/>`;
  if (c.current != null) { const [x, y] = polar(100, 100, 84, ang(c.current)); g += `<circle cx="${x}" cy="${y}" r="5" style="fill:var(--fg);stroke:var(--surface)" stroke-width="3"/>`; }
  for (let v = lo; v <= hi; v += 2) { const [x1, y1] = polar(100, 100, 70, ang(v)), [x2, y2] = polar(100, 100, 66, ang(v)); g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--faint)" stroke-width="1.5"/>`; }
  $("dial").innerHTML = g;
  $("c-set").innerHTML = c.target == null ? "–" : `${fmt(c.target, 1)}<sup>°C</sup>`;
  $("c-now").textContent = c.current == null ? "" : `Nu ${fmt(c.current, 1)} °C`;
  const act = $("c-act"); act.textContent = heating ? "Verwarmt" : (c.action === "off" ? "Uit" : "Op temperatuur");
  act.style.color = heating ? "var(--heat)" : "var(--muted)";
  const names = { comfort: "Comfort", eco: "Eco", away: "Afwezig", home: "Thuis", sleep: "Slapen", boost: "Boost", none: "Handmatig" };
  const presets = (c.presets && c.presets.length ? c.presets : []).slice(0, 4);
  $("c-modes").innerHTML = presets.map(p => `<button class="chip" id="preset-${p}" aria-pressed="${p === c.preset}" data-p="${p}">${names[p] || p}</button>`).join("");
}

function renderPrinter() {
  const p = S.printer; if (!p) return;
  $("src-printer").textContent = (p.name ? p.name + " · " : "") + srcLabel("printer");
  const map = { printen: ["Printen", "var(--print)"], printing: ["Printen", "var(--print)"], klaar: ["Klaar", "var(--ok)"], complete: ["Klaar", "var(--ok)"], completed: ["Klaar", "var(--ok)"],
    paused: ["Gepauzeerd", "var(--warn)"], pause: ["Gepauzeerd", "var(--warn)"], error: ["Fout", "var(--bad)"], idle: ["Stand-by", "var(--muted)"], standby: ["Stand-by", "var(--muted)"], unavailable: ["Offline", "var(--faint)"] };
  const [lbl, col] = map[p.state] || [p.state || "Onbekend", "var(--muted)"];
  const s = $("p-state"); s.textContent = lbl; s.style.color = col;
  const pr = Math.max(0, Math.min(100, p.progress ?? 0)), C = 2 * Math.PI * 50;
  $("p-ring").setAttribute("stroke-dasharray", `${C * pr / 100} ${C}`);
  $("p-ring").style.stroke = col;
  $("p-pct").innerHTML = `${fmt(pr)}<small>%</small>`;
  $("p-file").textContent = p.file && p.file !== "unknown" ? p.file : "Geen printopdracht";
  const left = p.left ?? 0, h = Math.floor(left / 3600), m = Math.round(left % 3600 / 60);
  const done = new Date(Date.now() + left * 1000).toLocaleTimeString(nl, { hour: "2-digit", minute: "2-digit" });
  const rows = [];
  if (left > 0) rows.push(["Resterend", (h ? h + " u " : "") + m + " min"], ["Klaar om", done]);
  rows.push(["Spuitmond", `${fmt(p.nozzle)} / ${fmt(p.nozzleT)} °C`], ["Bed", `${fmt(p.bed)} / ${fmt(p.bedT)} °C`]);
  if (p.layers) rows.push(["Laag", `${fmt(p.layer)} / ${fmt(p.layers)}`]);
  $("p-kv").innerHTML = rows.map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join("");
}

function renderWeather() {
  const w = S.weather; if (!w) return;
  const pl = CONFIG.places[placeIdx];
  $("src-weather").textContent = pl.town + " · " + (S.src.weather === "live" ? "live" : "voorbeeld");
  $("w-places").innerHTML = CONFIG.places.map((p, i) => `<button class="chip" id="place-${i}" data-i="${i}" aria-pressed="${i === placeIdx}">${esc(p.name)}</button>`).join("");
  const [desc, ic] = wmo(w.code, w.isDay);
  $("w-ico").innerHTML = svgIcon(ic);
  $("w-t").textContent = fmt(w.temp) + "°";
  $("w-desc").textContent = desc;
  $("w-extra").textContent = `Voelt als ${fmt(w.feels)}° · ${windDir(w.dir)} ${bft(w.wind)} Bft · ${fmt(w.hum)}%`;
  $("w-hours").innerHTML = w.hours.map(h => `<div>${h.t.getHours()}:00${svgIcon(wmo(h.code, h.day)[1])}<b>${fmt(h.temp)}°</b><span class="rain">${h.rain >= 20 ? h.rain + "%" : ""}</span></div>`).join("");
  const lo = Math.min(...w.days.map(d => d.min)), hi = Math.max(...w.days.map(d => d.max)), span = Math.max(1, hi - lo);
  $("w-days").innerHTML = w.days.map((d, i) => `<div class="day"><span class="n">${i === 0 ? "Vand." : d.t.toLocaleDateString(nl, { weekday: "short" })}</span>${svgIcon(wmo(d.code)[1])}<span class="lo">${fmt(d.min)}°</span><div class="bar"><i style="left:${(d.min - lo) / span * 100}%;right:${(hi - d.max) / span * 100}%"></i></div><span>${fmt(d.max)}°</span></div>`).join("");
}

function renderAgenda() {
  const a = S.agenda; if (!a) return;
  $("src-agenda").textContent = srcLabel("agenda");
  const now = new Date(), key = d => d.toDateString(), groups = {};
  a.forEach(ev => (groups[key(ev.start)] ||= []).push(ev));
  const today = new Date(); const tom = new Date(); tom.setDate(tom.getDate() + 1);
  const label = d => key(d) === key(today) ? "Vandaag" : key(d) === key(tom) ? "Morgen" : (x => x[0].toUpperCase() + x.slice(1))(d.toLocaleDateString(nl, { weekday: "long", day: "numeric", month: "long" }));
  const t = d => d.toLocaleTimeString(nl, { hour: "2-digit", minute: "2-digit" });
  let html = "";
  Object.values(groups).forEach(evs => {
    html += `<div class="aday">${label(evs[0].start)}</div>`;
    html += evs.map(ev => `<div class="ev ${!ev.allDay && ev.end && ev.end < now ? "past" : ""}"><div class="tm num">${ev.allDay ? "Hele dag" : t(ev.start)}${!ev.allDay && ev.end ? `<small>${t(ev.end)}</small>` : ""}</div><i style="background:${ev.color}"></i><div class="tt">${esc(ev.title)}${ev.sub ? `<small>${esc(ev.sub)}</small>` : ""}</div></div>`).join("");
  });
  $("a-list").innerHTML = html || `<div class="empty">Geen afspraken de komende dagen.</div>`;
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderPills() {
  const demo = Object.keys(S.src).filter(k => ["energy", "climate", "printer", "weather", "agenda"].includes(k)).some(k => S.src[k] !== "live");
  let h = "";
  if (S.energy && S.energy.solar > 20) h += `<span class="pill"><span class="dot" style="color:var(--sun)"></span>Zon <b class="num">${watt(S.energy.solar)}</b></span>`;
  if (S.climate) h += `<span class="pill"><span class="dot" style="color:var(--heat)"></span>Binnen <b class="num">${fmt(S.climate.current, 1)}°</b></span>`;
  if (WX[0]) h += `<span class="pill"><span class="dot" style="color:var(--cool)"></span>${esc(CONFIG.places[0].town)} <b class="num">${fmt(WX[0].temp)}°</b></span>`;
  if (S.src.ha === "fout") h += `<span class="pill demo">Home Assistant niet bereikbaar</span>`;
  else if (demo) h += `<span class="pill demo">Voorbeelddata</span>`;
  $("pills").innerHTML = h;
}

function render() { renderEnergy(); renderClimate(); renderPrinter(); renderWeather(); renderAgenda(); renderPills(); }

/* ---------- schermindeling ----------
   ?breedte=60          scherm gebruikt 60% van de breedte (bijv. naast je bureaubladiconen)
   ?positie=rechts      links | midden | rechts
   ?indeling=ultra      auto | ultra | normaal   (auto kiest zelf op basis van de verhouding)
   ?hoogte=70           scherm gebruikt 70% van de hoogte
   ?verticaal=onder     boven | midden | onder
   ?schaal=75           tekst en onderdelen kleiner (75%) of groter (bijv. 120%)
   Instellingen worden op dit apparaat onthouden; ?reset=1 zet alles terug. */
const LAYOUT = { breedte: 100, hoogte: 100, positie: "midden", verticaal: "midden", indeling: "auto", schaal: 100 };
(() => {
  try {
    const q = new URLSearchParams(location.search);
    if (q.has("reset")) ["breedte", "hoogte", "positie", "verticaal", "indeling", "schaal"].forEach(k => localStorage.removeItem("hs-" + k));
    for (const k of Object.keys(LAYOUT)) {
      if (q.has(k)) localStorage.setItem("hs-" + k, q.get(k));
      const v = localStorage.getItem("hs-" + k); if (v) LAYOUT[k] = ["breedte", "hoogte", "schaal"].includes(k) ? +v : v;
    }
  } catch (e) {}
})();
function applyLayout() {
  const w = $("app"), pct = Math.max(30, Math.min(100, LAYOUT.breedte || 100));
  const z = Math.max(40, Math.min(200, LAYOUT.schaal || 100)) / 100;
  const hp = Math.max(30, Math.min(100, LAYOUT.hoogte || 100));
  document.body.classList.toggle("part", pct < 100 || hp < 100);
  document.body.style.alignItems = hp < 100 ? ({ boven: "flex-start", onder: "flex-end" }[LAYOUT.verticaal] || "center") : "";
  w.style.zoom = z === 1 ? "" : z;
  w.style.width = (pct < 100 || z !== 1) ? (window.innerWidth * pct / 100 / z) + "px" : "";
  w.style.height = (z !== 1 || hp < 100) ? (window.innerHeight * hp / 100 / z) + "px" : "";
  w.style.minHeight = (z !== 1 || hp < 100) ? "0" : "";
  w.style.marginLeft = pct < 100 && LAYOUT.positie !== "links" ? "auto" : "";
  w.style.marginRight = pct < 100 && LAYOUT.positie !== "rechts" ? "auto" : "";
  const r = (window.innerWidth * pct / 100) / Math.max(1, window.innerHeight * hp / 100);
  const ultra = LAYOUT.indeling === "ultra" || (LAYOUT.indeling === "auto" && r >= 2.05 && window.innerWidth * pct / 100 / z >= 1500);
  if (ultra) w.dataset.layout = "ultra"; else delete w.dataset.layout;
}
window.addEventListener("resize", applyLayout);

/* ---------- start ---------- */
function start() {
  applyLayout();
  tickClock(); setInterval(tickClock, 1000);
  S.energy = demoEnergy(); S.src.energy = "demo";
  S.climate = { ...demoClimate }; S.src.climate = "demo";
  S.printer = demoPrinter(); S.src.printer = "demo";
  S.agenda = demoAgenda(); S.src.agenda = "demo";
  render();
  loadWeather(); setInterval(loadWeather, 15 * 60e3);
  if (LIVE) {
    pollHA().then(() => { loadSolarHistory(); loadAgenda(); });
    setInterval(pollHA, CONFIG.ha.pollSeconds * 1000);
    setInterval(loadSolarHistory, 5 * 60e3); setInterval(loadAgenda, 10 * 60e3);
  }
  setInterval(() => {
    if (S.src.energy !== "live") { const c = S.climate; S.energy = demoEnergy(); }
    if (S.src.printer !== "live") S.printer = demoPrinter();
    render();
  }, 5000);
  $("c-up").addEventListener("click", () => setTarget(+(S.climate?.step || .5)));
  $("c-down").addEventListener("click", () => setTarget(-(S.climate?.step || .5)));
  $("w-places").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) setPlace(+b.dataset.i); });
  $("c-modes").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (b) setPreset(b.dataset.p); });
  // scherm aan houden
  const wake = async () => { try { await navigator.wakeLock?.request("screen"); } catch (e) {} };
  wake(); document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && wake());
}
start();
</script>
